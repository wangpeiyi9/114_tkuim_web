<!-- Week12/client/signup_form.html -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>新增報名資料 - Week12</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="p-4 container">

  <h2>新增報名資料</h2>

  <button class="btn btn-secondary mb-3" onclick="location.href='list.html'">
    返回列表
  </button>

  <form id="signup-form" class="vstack gap-3">
    <input class="form-control" name="name" placeholder="姓名" required />
    <input class="form-control" name="email" type="email" placeholder="Email" required />
    <input class="form-control" name="phone" placeholder="手機號碼" required />
    <button class="btn btn-primary" id="submit-btn">送出</button>
  </form>

  <pre id="result" class="mt-4 bg-light border p-3"></pre>

  <script type="module" src="./signup_form.js"></script>
</body>
</html>
