<!-- Week12/client/login.html -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>登入系統 - Week12</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="p-4 container">

  <h2 class="mb-3">登入系統</h2>

  <form id="login-form" class="vstack gap-3">
    <input class="form-control" type="email" name="email" placeholder="Email" required />
    <input class="form-control" type="password" name="password" placeholder="密碼" required />
    <button class="btn btn-primary" type="submit">登入</button>
  </form>

  <p class="mt-3">還沒有帳號請向管理員索取或呼叫 /auth/signup 建立。</p>

  <pre id="result" class="mt-4 bg-light border p-3"></pre>

  <script type="module" src="./login.js"></script>
</body>
</html>
